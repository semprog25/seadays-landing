name: Generate Static Blogs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'

# Only one generation against main at a time. Newer source commits cancel stale
# long-running jobs so they cannot race-push over newer main.
concurrency:
  group: generate-static-blogs-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so rebase onto a moved main can find merge-bases.
          fetch-depth: 0

      - name: Record generation base SHA
        id: source
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generation base: ${GITHUB_SHA}"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify SUPABASE_ANON_KEY
        run: |
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY is required. Add it to repository secrets."
            exit 1
          fi

      # Fail closed: without Viator secrets, generate-blogs would rewrite port CTAs to /#download
      # (or drop Bookable Experiences when known-port data is missing). Do not deploy that.
      - name: Verify Viator affiliate secrets
        run: |
          if [ -z "${{ secrets.VIATOR_AFFILIATE_PID }}" ] || [ -z "${{ secrets.VIATOR_AFFILIATE_MCID }}" ]; then
            echo "::error::VIATOR_AFFILIATE_PID and VIATOR_AFFILIATE_MCID are required repository secrets so port guide CTAs keep live affiliate URLs."
            exit 1
          fi

      - name: Generate static blogs
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEADAYS_MATERIALIZE_SIGNED: '1'
          VIATOR_AFFILIATE_PID: ${{ secrets.VIATOR_AFFILIATE_PID }}
          VIATOR_AFFILIATE_MCID: ${{ secrets.VIATOR_AFFILIATE_MCID }}
          VIATOR_AFFILIATE_MEDIUM: link
        run: npm run generate-blogs

      - name: Fix featured guide thumbnails (ports/ships)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run fix-featured-guide-thumbnails

      - name: Guard against placeholder featured thumbs
        run: |
          node -e "
          const fs=require('fs');
          const badRe=/Websitehomebucket\\/Cruise%20planner\\.jpg|Websitehomebucket\\/Discover%20Ships%20%20Ports\\.jpg|SeadaysPublic\\/seadaysfav\\.png/i;
          let failed=false;
          for (const f of ['ports/index.html','ships/index.html']) {
            const html=fs.readFileSync(f,'utf8');
            const cards=[...html.matchAll(/<a class=\"guide-card\"[^>]*>[\\s\\S]*?<img\\b([^>]*)>/gi)];
            for (const m of cards) {
              const attrs=m[1]||'';
              const src=(attrs.match(/\\bsrc=\"([^\"]+)\"/i)||[])[1]||'';
              const type=(attrs.match(/data-img-type=\"([^\"]+)\"/i)||[])[1]||'';
              if (type==='fallback' || badRe.test(src)) {
                console.error('PLACEHOLDER featured thumb in', f, src.slice(0,120));
                failed=true;
              }
            }
          }
          if (failed) process.exit(1);
          console.log('featured thumbs OK');
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- blog/ sitemap.xml index.html ships/ ports/ || echo "changed=true" >> $GITHUB_OUTPUT
          git status --short

      - name: Commit and push (safe)
        if: steps.changes.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          chmod +x scripts/ci-safe-push-generated.sh
          bash scripts/ci-safe-push-generated.sh
