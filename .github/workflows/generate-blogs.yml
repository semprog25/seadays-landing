name: Generate blogs

# Channel B — blog/SEO generation only.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generateBlogs.js'
      - 'scripts/lib/adsenseArticleSlot.js'
      - 'scripts/lib/blogStoreCta.js'
      - 'scripts/inject-blog-store-ctas.js'
      - 'scripts/lib/adsenseConfig.js'
      - 'scripts/lib/analyticsSnippet.js'
      - 'scripts/lib/faviconHead.js'
      - 'scripts/lib/seoKeywordLinks.js'
      - 'scripts/inject-blog-ad-slots.js'
      - 'scripts/inject-blog-port-links.js'
      - 'scripts/inject-analytics-head.js'
      - 'blog-article.html'
      - '.github/workflows/generate-blogs.yml'
  schedule:
    # CMS-published articles are not git-triggered; pick them up daily without touching ports.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Generation channel
        type: choice
        options: [blogs, sitemap, auto]
        default: blogs

concurrency:
  group: seadays-landing-generate
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      channel: ${{ steps.plan.outputs.channel }}
      needs_viator: ${{ steps.plan.outputs.needs_viator }}
      commit_message: ${{ steps.plan.outputs.commit_message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify generation channel
        id: plan
        env:
          GENERATION_CHANNEL: ${{ github.event.inputs.channel || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-classify-generation.js

  generate:
    needs: classify
    if: needs.classify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Record generation base SHA
        id: source
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify SUPABASE_ANON_KEY
        run: |
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY is required. Add it to repository secrets."
            exit 1
          fi

      - name: Verify Viator affiliate secrets
        if: needs.classify.outputs.needs_viator == 'true'
        run: |
          if [ -z "${{ secrets.VIATOR_AFFILIATE_PID }}" ] || [ -z "${{ secrets.VIATOR_AFFILIATE_MCID }}" ]; then
            echo "::error::VIATOR_AFFILIATE_PID and VIATOR_AFFILIATE_MCID are required for this generation channel."
            exit 1
          fi

      - name: Generate channel
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEADAYS_MATERIALIZE_SIGNED: '1'
          VIATOR_AFFILIATE_PID: ${{ secrets.VIATOR_AFFILIATE_PID }}
          VIATOR_AFFILIATE_MCID: ${{ secrets.VIATOR_AFFILIATE_MCID }}
          VIATOR_AFFILIATE_MEDIUM: link
        run: bash scripts/ci-run-channel.sh ${{ needs.classify.outputs.channel }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- blog/ sitemap.xml index.html ships/ ports/ || echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Commit and push (safe)
        if: steps.changes.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMMIT_MSG: ${{ needs.classify.outputs.commit_message }}
        run: bash scripts/ci-safe-push-generated.sh
