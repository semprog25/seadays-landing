name: Full static rebuild

# Channel D — intentional full regeneration. Orphan catalogue cleanup is off
# unless explicitly enabled. Never runs on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      allow_orphan_cleanup:
        description: Delete ship/port directories that are not in the current dataset (destructive)
        type: boolean
        default: false

concurrency:
  group: seadays-landing-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Record generation base SHA
        id: source
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify SUPABASE_ANON_KEY
        run: |
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY is required. Add it to repository secrets."
            exit 1
          fi

      - name: Verify Viator affiliate secrets
        run: |
          if [ -z "${{ secrets.VIATOR_AFFILIATE_PID }}" ] || [ -z "${{ secrets.VIATOR_AFFILIATE_MCID }}" ]; then
            echo "::error::VIATOR_AFFILIATE_PID and VIATOR_AFFILIATE_MCID are required for a full rebuild."
            exit 1
          fi

      - name: Generate full site
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEADAYS_MATERIALIZE_SIGNED: '1'
          VIATOR_AFFILIATE_PID: ${{ secrets.VIATOR_AFFILIATE_PID }}
          VIATOR_AFFILIATE_MCID: ${{ secrets.VIATOR_AFFILIATE_MCID }}
          VIATOR_AFFILIATE_MEDIUM: link
          ALLOW_ORPHAN_CLEANUP: ${{ github.event.inputs.allow_orphan_cleanup }}
        run: bash scripts/ci-run-channel.sh full

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- blog/ sitemap.xml index.html ships/ ports/ || echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Commit and push (safe)
        if: steps.changes.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMMIT_MSG: "chore: regenerate static blog, ships, ports, and sitemap [skip ci]"
        run: bash scripts/ci-safe-push-generated.sh
